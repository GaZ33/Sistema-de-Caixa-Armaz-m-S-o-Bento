{% extends 'base_template.html' %}
{% block title %}Lista de Clientes{% endblock %}

{% block styles %}
    <link rel="stylesheet" href="{{ url_for('static', filename='clientes/style.css') }}" />
{% endblock %}

{% block content %}
<div class="app-wrapper">
    <div class="main-area">
        <header class="topbar">
            <a href="/" class="topbar-btn">
                <img src="/static/icones/Home.png" alt="Home">
                HOME
            </a>
            <div class="nav-group">
                <a href="/clientes/index.html" class="topbar-btn active">
                    <img src="/static/icones/Clientes.png" alt="Clientes">
                    CLIENTES
                </a>
                <div class="nav-sub">
                    <a onclick="abrirModal('modal-cadastrar')" class="topbar-btn" style="cursor:pointer;">
                        <img src="/static/icones/Adicionar.png" alt="Cadastrar Cliente">
                        CADASTRAR CLIENTE
                    </a>
                    <a onclick="toggleBuscaCliente()" class="topbar-btn" style="cursor:pointer;">
                        <img src="/static/icones/ProcurarCadastro.png" alt="Procurar">
                        PROCURAR CADASTRO
                    </a>
                </div>
            </div>
            <a href="/produtos/index.html" class="topbar-btn">
                <img src="/static/icones/Produto.png" alt="Produtos">
                ESTOQUE
            </a>
            <div class="topbar-spacer"></div>
            <form method="post" action="{{ url_for('auth.logout') }}">
                <button type="submit" class="topbar-btn topbar-action">
                    <img src="/static/icones/Desligar.png" alt="Sair">
                    Sair
                </button>
            </form>
        </header>

        <main class="page-content clientes-page">
            <section class="clientes-toolbar">
                <h2 class="titulo-cliente">Lista de Clientes</h2>
            </section>

            <div class="busca-wrapper" id="busca-wrapper-cliente">
                <input id="client-search" class="product-search" type="search" placeholder="Buscar por nome, usuário ou email">
            </div>

            <div id="client-list" class="client-list">
                <!-- cards gerados pelo JS -->
            </div>
        </main>

    </div>
</div>

    <div class="modal-overlay" id="modal-cadastrar" onclick="fecharModal('modal-cadastrar')">
        <div class="modal-box" onclick="event.stopPropagation()">
            <button class="xmodal" onclick="fecharModal('modal-cadastrar')">✕</button>
            <img src="/static/icones/Clientes.png" alt="Cliente" class="modal-icon">
            <h2 class="modal-title">CADASTRAR CLIENTE</h2>

            <label>Nome <span style="color:red">*</span></label>
            <input type="text" id="cad-nome" placeholder="">

            <label>Sobrenome</label>
            <input type="text" id="cad-sobrenome" placeholder="">

            <label>CPF</label>
            <input type="text" id="cad-cpf" placeholder="">

            <label>Telefone</label>
            <input type="text" id="cad-telefone" placeholder="">

            <label>Email</label>
            <input type="email" id="cad-email" placeholder="">

            <button class="modal-btn" id="modal-cliente-btn" onclick="handleModalClienteBtn()">Enviar</button>
        </div>
    </div>

{% endblock %}

{% block scripts %}
    <script src="{{ url_for('static', filename='clientes/script.js') }}" defer></script>
{% endblock %}
