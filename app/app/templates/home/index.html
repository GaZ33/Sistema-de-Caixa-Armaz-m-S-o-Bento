{# Home page #}
{% extends 'base_template.html' %}

{% block title %}Tela Inicial{% endblock %}

{% block content %}
<div class="app-wrapper">

    <div class="main-area">

        <!-- Menu Superior -->
        <header class="topbar">
    <div class="nav-group">
        <a href="/" class="topbar-btn active">
            <img src="/static/icones/Home.png" alt="Home">
            HOME
        </a>
        <div class="nav-sub">
            <a onclick="abrirModal('modal-nova-conta')" class="topbar-btn" style="cursor:pointer;">
                <img src="/static/icones/Adicionar.png" alt="Nova Conta">
                NOVA CONTA
            </a>
        </div>
    </div>
    <a href="/clientes/index.html" class="topbar-btn">
        <img src="/static/icones/Clientes.png" alt="Clientes">
        CLIENTES
    </a>
    <a href="/produtos/index.html" class="topbar-btn">
        <img src="/static/icones/Produto.png" alt="Produtos">
        PRODUTOS
    </a>
        <div class="topbar-spacer"></div>
    <a href="#" class="topbar-btn">
        <img src="/static/icones/Login.png" alt="Perfil">
        PERFIL
    </a>
</header>

<main class="page-content home-empty">
    <div class="empty-state">
        <img src="/static/icones/Gato.png" alt="Nenhuma operação">
        <p class="empty-title">Nenhuma Operação<br>em Andamento</p>
    </div>
</main>

    </div>
</div>
<!-- Modal Nova Conta -->
<div class="modal-overlay modal-grande" id="modal-nova-conta" onclick="fecharModal('modal-nova-conta')">
    <div class="modal-box modal-box-grande" onclick="event.stopPropagation()">
        <button class="xmodal" onclick="fecharModal('modal-nova-conta')">✕</button>
        <h2 class="modal-title">NOVA CONTA</h2>

        <div class="conta-tabela-wrapper">
            <table class="conta-tabela">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Marca</th>
                        <th>Quant.</th>
                        <th>Preço Unit.</th>
                        <th>Sub Total</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="conta-itens">
                    <!-- itens carregados pelo JS -->
                </tbody>
            </table>
        </div>

        <div class="conta-total">
            Total: <span id="conta-valor-total">0,00</span>
        </div>

        <div class="conta-acoes">
            <button class="topbar-btn" onclick="adicionarACliente()">
                <img src="/static/icones/Clientes.png" alt="Adicionar a Cliente">
                ADICIONAR A CLIENTE
            </button>
            <button class="topbar-btn" onclick="cancelarConta()">
                <img src="/static/icones/não.png" alt="Cancelar Conta">
                CANCELAR CONTA
            </button>
            <button class="topbar-btn" onclick="finalizarConta()">
                <img src="/static/icones/Sim.png" alt="Finalizar Conta">
                FINALIZAR CONTA
            </button>
        </div>
    </div>
</div>

{% endblock %}
