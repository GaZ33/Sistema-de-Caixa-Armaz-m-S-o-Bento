<!-- pdv.html -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Sistema Armazém - PDV</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" /> <!-- Adiciona o CSS do Select2 -->
</head>
<body class="bg-light">
<div class="container-fluid mt-4">
    <div class="row">
        <!-- Coluna de Seleção de Produtos -->
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white"><h5>Itens da Venda</h5></div>
                <div class="card-body">
                    <div class="input-group mb-3">
                        <select id="busca_produto" class="form-control" style="width: 100%;"></select> <!-- Substitui o input pelo Select2 -->
                        <button class="btn btn-outline-secondary" type="button" id="btn_adicionar">Adicionar</button>
                    </div>
                    
                    <table class="table table-hover" id="tabela_venda">
                        <thead>
                            <tr>
                                <th>Produto</th>
                                <th>Preço Unit.</th>
                                <th>Qtd</th>
                                <th>Subtotal</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Itens inseridos via jQuery -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Coluna de Fechamento -->
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white"><h5>Resumo</h5></div>
                <div class="card-body">
                    <h2 class="text-end">Total: <span id="valor_total">R$ 0,00</span></h2>
                    <hr>
                    <label>Forma de Pagamento:</label>
                    <select class="form-control mb-3" id="forma_pagamento">
                        <option value="dinheiro">Dinheiro</option>
                        <option value="pix">PIX</option>
                        <option value="cartao_credito">Cartão de Crédito</option>
                    </select>
                    <button class="btn btn-success w-100 btn-lg" id="finalizar_venda">FINALIZAR VENDA (F2)</button>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="modalQuantidade" tabindex="-1" aria-labelledby="modalQuantidadeLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalQuantidadeLabel">Definir Quantidade</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="formQuantidade">
                    <div class="mb-3">
                        <label for="quantidade" class="form-label">Quantidade</label>
                        <input type="number" class="form-control" id="quantidade" min="1" value="1">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-primary" id="confirmarQuantidade">Confirmar</button>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script> <!-- Adiciona o JS do Select2 -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script> <!-- Adiciona o JS do Bootstrap -->
<script src="{{ url_for('static', filename='ponto_de_venda/script.js') }}"></script>
<script>
  
</script>
</body>
</html>
