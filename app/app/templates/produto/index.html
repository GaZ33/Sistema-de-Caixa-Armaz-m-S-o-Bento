{% extends 'base_template.html' %}

{% block title %}Gestão de Produtos{% endblock %}

{% block styles %}
<link rel="stylesheet" href="/static/produto/style.css">
{% endblock %}

{% block content %}
<header>
    <h1>Gestão de Produtos</h1>
</header>
<main>
    <button id="add-product-button">Adicionar Produto</button>

    <!-- Modal para Adicionar/Editar Produto -->
    <div id="product-modal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h2 id="modal-title">Adicionar Produto</h2>
            <form id="form-product">
                <input type="hidden" id="product-id">
                <div>
                    <label for="product-name">Nome:</label>
                    <input type="text" id="product-name" required>
                </div>
                <div>
                    <label for="product-price">Preço:</label>
                    <input type="number" id="product-price" step="0.01" required>
                </div>
                <div>
                    <label for="product-unit">Unidade:</label>
                    <select id="product-unit" required>
                        <option value="">Selecione</option>
                        <option value="pacote">Pacote</option>
                        <option value="unidade">Unidade</option>
                        <option value="kg">Kg</option>
                        <option value="ml">Ml</option>
                    </select>
                </div>
                <div>
                    <label for="product-code">Código:</label>
                    <input type="text" id="product-code" required>
                </div>
                <div>
                    <label for="product-brand">Marca:</label>
                    <input type="text" id="product-brand" required>
                </div>
                <button type="submit">Salvar</button>
                <button type="button" id="delete-product-button" style="display: none;">Excluir</button>
            </form>
        </div>
    </div>

    <!-- Tabela de Produtos -->
    <section id="product-list">
        <h2>Lista de Produtos</h2>
        <table id="product-table" class="display">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Preço</th>
                    <th>Unidade</th>
                    <th>Código</th>
                    <th>Marca</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <!-- Produtos serão carregados aqui dinamicamente -->
            </tbody>
        </table>
    </section>
</main>

{% endblock %}

{% block scripts %}
<script src="/static/produto/script.js" defer></script>
{% endblock %}
